<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub User Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-bold text-center mb-4">GitHub User Viewer</h1>

    <input id="usernameInput" value="octocat"
      class="border p-2 rounded w-full mb-2" />
    <button id="searchBtn"
      class="bg-blue-600 text-white px-4 py-2 rounded w-full mb-4">
      Search
    </button>

    <p id="status" class="text-center text-gray-500 mb-2"></p>
    <div id="result"></div>
    <button id="retryBtn" hidden
      class="bg-red-600 text-white px-4 py-2 rounded w-full mt-2">
      Retry
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
